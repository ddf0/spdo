[project]
name = "spdo"
version = "0.1.0"
description = "Система интеллектуального поиска дубликатов обращений в техническую поддержку"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Vadim Elkin" },
  { name = "Daniil Krasavin" },
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "sentence-transformers>=3.0",
  "scikit-learn>=1.5",
  "rank-bm25>=0.2.2",
  "bcrypt>=4.2",
  "itsdangerous>=2.2",
]

[project.scripts]
spdo = "spdo.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "playwright>=1.47",
  "radon>=6.0",
  "sphinx>=8.0",
  "furo>=2024.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spdo"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=spdo --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
branch = true
source = ["spdo"]
