services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: spdo
      POSTGRES_USER: spdo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spdo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spdo -d spdo"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      SPDO_DATABASE_URL: postgresql+psycopg://spdo:${POSTGRES_PASSWORD:-spdo}@db:5432/spdo
    ports:
      - "8000:8000"
    volumes:
      - models:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
