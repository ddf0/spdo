{% extends "base.html" %}
{% block title %}Смена пароля — СПДО{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Смена пароля</h1>
  {% if done %}<p class="success" role="status">Пароль изменён. Сеансы на других устройствах завершены.</p>{% endif %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <label>Текущий пароль
      <input name="current" type="password" autocomplete="current-password" required>
    </label>
    <label>Новый пароль (не короче 8 символов)
      <input name="new" type="password" autocomplete="new-password" minlength="8" required>
    </label>
    <label>Повтор нового пароля
      <input name="confirm" type="password" autocomplete="new-password" minlength="8" required>
    </label>
    <button type="submit">Сменить пароль</button>
  </form>
</section>
{% endblock %}
